name: Publish PR Performance

on:
  workflow_run:
    workflows: [PR Performance]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

# Serialize publishers; each one checks the PR's current head before writing.
concurrency:
  group: performance-publisher
  queue: max
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # This job must never execute a PR checkout or code from its artifact.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Validate measurements and update the PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/performance_report.py
